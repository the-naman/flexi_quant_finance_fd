name: alerts

# 5.12: operational alerts and the weekly digest (same file in both repos), sent by ci/alerts.py.
# Every two hours (after the prod jobs: 04:53 to 20:53 IST) it looks at the prod health views and mails new findings once;
# test once a day at 07:07 IST, after the test jobs (audit B4, B6). Findings:
# refused files, Silver rebuilt, quarantine spike, new source columns, and in BHG group merge waiting and
# over-limit customers. Monday 09:17 IST: weekly digest. Daily 20:49 IST: dev activity (requirement 10: every
# dev job run of the day, to Developer and Team Lead). Rules and recipients: config/alerts.yml.
# Scheduled runs use env prod (dev activity: env dev) and stay quiet until config/alerts.yml live is on (5.13).
# Databricks access: service principal sp_lh_notices (group lh_ci, read-only grants), never the admin token.
# By hand: Actions -> alerts -> Run workflow; choose env, what and mode (dry-run = print only, send nothing).
# 28a: if a scheduled run fails (e.g. Databricks paused), ci/watchdog.py mails the fixers once, a daily reminder while it
# stays down, and "monitoring back" when it works again (roles: config/ci.yml -> watchdog).

on:
  schedule:
    - cron: "23 23,1,3,5,7,9,11,13,15 * * *"   # UTC = 04:53 IST, then every 2 h until 20:53 IST: prod alerts
    - cron: "37 1 * * *"                       # 07:07 IST: test alerts, after the test jobs (05:00, 06:00)
    - cron: "47 3 * * 1"                       # Monday 09:17 IST: weekly digest
    - cron: "19 15 * * *"                      # daily 20:49 IST: dev activity
    # 28c: odd minutes (:11 :19 :23 :37 :47), not :00/:15/:30/:45, where GitHub delays or drops scheduled runs (3 Nov)
  workflow_dispatch:
    inputs:
      env:
        type: choice
        options: [prod, test, dev]
        default: test
      what:
        type: choice
        description: alerts / digest (env test or prod) or dev-activity (env dev)
        options: [alerts, digest, dev-activity]
        default: alerts
      mode:
        type: choice
        description: dry-run = print, send nothing; sample = print every alert with today's data; send = for real
        options: [dry-run, sample, send]
        default: dry-run

permissions:
  contents: read
  actions: read      # 28a: the watchdog reads earlier runs of this workflow

concurrency:
  group: alerts-${{ github.repository }}
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install --quiet pyyaml==6.0.3 databricks-sdk==0.143.0
      - name: Look at the health views, send what is new
        timeout-minutes: 12   # 28a: a hang fails this step, so the watchdog below still runs
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.LH_NOTICES_CLIENT_ID }}          # service principal sp_lh_notices (group lh_ci):
          DATABRICKS_CLIENT_SECRET: ${{ secrets.LH_NOTICES_CLIENT_SECRET }}  # read-only, never the admin token
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MAIL_DEVELOPER: ${{ secrets.MAIL_DEVELOPER }}
          MAIL_TEAMLEAD: ${{ secrets.MAIL_TEAMLEAD }}
          MAIL_MANAGER: ${{ secrets.MAIL_MANAGER }}
          MAIL_MANAGEMENT: ${{ secrets.MAIL_MANAGEMENT }}
          ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.env || (github.event.schedule == '19 15 * * *' && 'dev' || (github.event.schedule == '37 1 * * *' && 'test' || 'prod')) }}
          WHAT: ${{ github.event_name == 'workflow_dispatch' && inputs.what || (github.event.schedule == '47 3 * * 1' && 'digest' || (github.event.schedule == '19 15 * * *' && 'dev-activity' || 'alerts')) }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'send' }}
          SCHEDULED: ${{ github.event_name == 'schedule' && 'yes' || 'no' }}
        run: |
          flags=""
          case "$MODE" in
            dry-run) flags="--dry-run" ;;
            sample)  flags="--sample" ;;
          esac
          [ "$WHAT" = digest ] && flags="$flags --digest"
          [ "$WHAT" = dev-activity ] && flags="$flags --dev-activity"
          [ "$SCHEDULED" = yes ] && flags="$flags --scheduled"
          python ci/alerts.py --env "$ENV" $flags
      - name: Watchdog, mail the fixers when this scheduled check fails or recovers (28a, ci/watchdog.py)
        if: always() && github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MAIL_DEVELOPER: ${{ secrets.MAIL_DEVELOPER }}
          MAIL_TEAMLEAD: ${{ secrets.MAIL_TEAMLEAD }}
          MAIL_MANAGER: ${{ secrets.MAIL_MANAGER }}
          MAIL_MANAGEMENT: ${{ secrets.MAIL_MANAGEMENT }}
          ENV: ${{ github.event.schedule == '19 15 * * *' && 'dev' || (github.event.schedule == '37 1 * * *' && 'test' || 'prod') }}
        run: python3 ci/watchdog.py --workflow alerts --env "$ENV" --result "$RESULT"
