name: simulator

on:
  # Nightly 00:30 IST for test + prod. Switched on at go-live (step 5.13):
  # schedule:
  #   - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        type: choice
        options: [dev, test, prod]
        default: dev

permissions:
  contents: read

concurrency:
  group: simulator-${{ github.event_name }}-${{ inputs.env || 'nightly' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.p.outputs.envs }}
    steps:
      - id: p
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo 'envs=["test","prod"]' >> "$GITHUB_OUTPUT"
          else
            echo 'envs=["${{ inputs.env }}"]' >> "$GITHUB_OUTPUT"
          fi

  simulate:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.plan.outputs.envs) }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.env == 'dev' && 'fqf_dev' || format('fqf_sim_{0}', matrix.env) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fqf_${{ matrix.env }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet boto3
      - name: Write source files to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_SIM_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SIM_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: python -m simulator.run --company fqf --env ${{ matrix.env }} --s3
