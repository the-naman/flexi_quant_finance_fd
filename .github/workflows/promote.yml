name: promote

# 5.10: a pull request into <code>_test or <code>_prod (same file in both repos).
#   route    - ci/route.py: test only accepts PRs from <code>_dev, prod only from <code>_test;
#              10j hotfix: <code>_hotfix_<name> (from prod) -> test (URGENT, Management) -> prod (Business-user Manager)
#   checks   - ci/checks.py (compile, no outputs, yaml, job graph, dashboards, no email or token, ruff) + pytest tests/
#   approval - waits for the environment's reviewer (today the-naman for test and prod, decided 24 Oct 2026).
#              Reject = this check fails = the PR cannot merge; fix on the lower branch, push, a new approval starts.
#   notices  - Gmail to the roles in config/ci.yml (addresses are secrets, never printed)
# The ruleset of <code>_test / <code>_prod requires route, checks and approval before merge.

on:
  pull_request:
    branches: ["*_test", "*_prod"]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: promote-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.r.outputs.code }}
      env: ${{ steps.r.outputs.env }}
      flow: ${{ steps.r.outputs.flow }}
      environment: ${{ steps.r.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0                        # route.py compares the branches (hotfix rules)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install --quiet pyyaml==6.0.3
      - id: r
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python ci/route.py

  checks:
    needs: route
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install --quiet pyyaml==6.0.3 ruff==0.15.11 pytest==8.3.3 pyspark==3.5.3 pillow==11.0.0 jsonschema==4.23.0 regex==2024.11.6   # Spark tests use the runner's Java; Pillow for the FQF slip images
      - run: python ci/checks.py
      - name: Asset Bundle valid against the bundle schema (pinned Databricks CLI, checksum verified, no login)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cli.zip" https://github.com/databricks/cli/releases/download/v1.20.0/databricks_cli_1.20.0_linux_amd64.zip
          echo "dff217c237c4e53b2b2427ee131cfe5bace3178ed156cd98860d56feb13ce02f  $RUNNER_TEMP/cli.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/cli.zip" databricks -d "$RUNNER_TEMP/cli"
          "$RUNNER_TEMP/cli/databricks" bundle schema > "$RUNNER_TEMP/bundle_schema.json"
          python ci/bundle.py --check --schema "$RUNNER_TEMP/bundle_schema.json"
      - run: python -m pytest -p no:cacheprovider   # tests/: config rules, simulator, scenarios on local Spark

  request:
    needs: [route, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install --quiet pyyaml==6.0.3
      - name: Mail "approval needed"
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MAIL_DEVELOPER: ${{ secrets.MAIL_DEVELOPER }}
          MAIL_TEAMLEAD: ${{ secrets.MAIL_TEAMLEAD }}
          MAIL_MANAGER: ${{ secrets.MAIL_MANAGER }}
          MAIL_BIZMANAGER: ${{ secrets.MAIL_BIZ_MANAGER }}
          MAIL_MANAGEMENT: ${{ secrets.MAIL_MANAGEMENT }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          python ci/notify.py --flow "${{ needs.route.outputs.flow }}" --event request --env "${{ needs.route.outputs.env }}" \
            --subject "Approval needed: $HEAD -> $BASE" \
            --body "Pull request: $TITLE
          $URL
          Checks passed. Open the run of this pull request and approve or reject the waiting 'approval' step.
          Reject sends it back to $HEAD."

  approval:
    needs: [route, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ${{ needs.route.outputs.environment }}     # <code>_test, <code>_prod or (hotfix) <code>_test_hotfix
    steps:
      - run: echo "Approved for ${{ github.base_ref }}"

  result:
    needs: [route, checks, approval]
    if: always() && needs.route.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install --quiet pyyaml==6.0.3
      - name: Mail the result
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MAIL_DEVELOPER: ${{ secrets.MAIL_DEVELOPER }}
          MAIL_TEAMLEAD: ${{ secrets.MAIL_TEAMLEAD }}
          MAIL_MANAGER: ${{ secrets.MAIL_MANAGER }}
          MAIL_BIZMANAGER: ${{ secrets.MAIL_BIZ_MANAGER }}
          MAIL_MANAGEMENT: ${{ secrets.MAIL_MANAGEMENT }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          CHECKS: ${{ needs.checks.result }}
          APPROVAL: ${{ needs.approval.result }}
        run: |
          if [ "$CHECKS" != "success" ]; then
            outcome="Checks failed"; next="Fix it on $HEAD and push; the checks run again."
          elif [ "$APPROVAL" = "success" ]; then
            outcome="Approved"; next="It can be merged now. After the merge, $BASE is deployed automatically."
          elif [ "$APPROVAL" = "cancelled" ]; then
            echo "superseded by a newer push, no mail"; exit 0
          else
            outcome="Rejected"; next="It goes back to $HEAD: fix it there and push; a new approval starts."
          fi
          python ci/notify.py --flow "${{ needs.route.outputs.flow }}" --event result --env "${{ needs.route.outputs.env }}" \
            --subject "$outcome: $HEAD -> $BASE" \
            --body "Pull request: $TITLE
          $URL
          $outcome. $next"
