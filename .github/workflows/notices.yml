name: notices

# 10e: business notices (same file in both repos). Every two hours from 03:41 IST it asks Databricks how the last
# daily run went and mails the business roles in plain language (ci/notices.py):
#   "today's figures are delayed" / "figures are up to date again" and, in BHG, "what FQF data was merged".
# Each notice is sent once (recorded in <catalog>.ops.notice_log). Technical failure mails come from Databricks.
# Databricks access: service principal sp_lh_notices (group lh_ci, read-only grants from setup_once/01_grant_access).
# By hand: Actions -> notices -> Run workflow; choose env and dry run (dry run = print only, send nothing).
# 28a: if a scheduled run fails (e.g. Databricks paused), ci/watchdog.py mails the fixers (never business roles) once,
# a daily reminder while it stays down, and "monitoring back" when it works again (roles: config/ci.yml -> watchdog).

on:
  schedule:
    - cron: "11 22,0,2,4,6,8,10,12,14 * * *"   # UTC = 03:41 IST, then every 2 h until 19:41 IST
    # 28c: minute :11, not :15, where GitHub delays or drops scheduled runs (3 Nov)
  workflow_dispatch:
    inputs:
      env:
        type: choice
        options: [prod, test]
        default: test
      mode:
        type: choice
        description: dry-run = print, send nothing; sample = print all notices with today's data; send = for real
        options: [dry-run, sample, send]
        default: dry-run

permissions:
  contents: read
  actions: read      # 28a: the watchdog reads earlier runs of this workflow

concurrency:
  group: notices-${{ github.repository }}
  cancel-in-progress: false

jobs:
  notices:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install --quiet pyyaml==6.0.3 databricks-sdk==0.143.0
      - name: Check the last run and the group merge, send what is new
        timeout-minutes: 12   # 28a: a hang fails this step, so the watchdog below still runs
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.LH_NOTICES_CLIENT_ID }}          # service principal sp_lh_notices (group lh_ci):
          DATABRICKS_CLIENT_SECRET: ${{ secrets.LH_NOTICES_CLIENT_SECRET }}  # read-only, never the admin token
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MAIL_DEVELOPER: ${{ secrets.MAIL_DEVELOPER }}
          MAIL_TEAMLEAD: ${{ secrets.MAIL_TEAMLEAD }}
          MAIL_MANAGER: ${{ secrets.MAIL_MANAGER }}
          MAIL_BIZMANAGER: ${{ secrets.MAIL_BIZ_MANAGER }}
          MAIL_MANAGEMENT: ${{ secrets.MAIL_MANAGEMENT }}
          ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.env || 'prod' }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'send' }}
        run: |
          case "$MODE" in
            dry-run) flag="--dry-run" ;;
            sample)  flag="--sample" ;;
            *)       flag="" ;;
          esac
          python ci/notices.py --env "$ENV" $flag
      - name: Watchdog, mail the fixers when this scheduled check fails or recovers (28a, ci/watchdog.py)
        if: always() && github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MAIL_DEVELOPER: ${{ secrets.MAIL_DEVELOPER }}
          MAIL_TEAMLEAD: ${{ secrets.MAIL_TEAMLEAD }}
          MAIL_MANAGER: ${{ secrets.MAIL_MANAGER }}
          MAIL_MANAGEMENT: ${{ secrets.MAIL_MANAGEMENT }}
          ENV: prod
        run: python3 ci/watchdog.py --workflow notices --env "$ENV" --result "$RESULT"
