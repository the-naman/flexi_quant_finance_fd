# Gold layer: a star schema per company. One event fact, its dimensions, and a date dimension
# that is built the same way in every catalog so both companies can be joined on date_key.
dim_date:
  start: 2025-01-01              # before the oldest history (BHG starts April 2025)
  end: 2027-12-31
  fiscal_year_start_month: 4     # India: the financial year runs April to March
  
# 5.5s: Gold is written in SQL. One SELECT per table in gold/sql/<name>.sql, run in this order.
# A name starting with "_" is a helper step: a temporary view that later files read, never saved.
sql_build:
  bhg: [dim_date, dim_hospital, dim_doctor, dim_patient, _bhg_events, dim_payer, fact_bhg_event]
  fqf: [dim_date, dim_branch, dim_product, dim_customer, dim_loan, fact_fqf_event]
