# 5.12: operational alerts and the weekly digest (same file in both repos), sent by .github/workflows/alerts.yml
# (ci/alerts.py) as service principal sp_lh_notices (read-only: gold views and ops tables). Groups of findings go
# out in one mail; every finding is sent once (recorded in <catalog>.ops.notice_log as alert_<kind>).
# Not repeated here: a failed task (Databricks mails the fixers, config/jobs.yml notify) and "figures delayed"
# (business notice, config/jobs.yml business_notice). The digest counts them.
live: {dev: true, test: true, prod: true}      # live since go-live (5.13, 23 Oct 2026); false = scheduled runs quiet
roles:                                    # who gets the alerts (MAIL_<ROLE> GitHub secrets)
  test: [developer, teamlead, manager, management]
  prod: [developer, teamlead, manager, management]
dev_activity_roles: [developer, teamlead] # requirement 10: daily digest of everyone's dev job runs (20:45 IST)
digest_roles:                             # who gets the weekly digest (Monday 09:15 IST)
  test: [developer, teamlead, manager, management]
  prod: [developer, teamlead, manager, management]
lookback_days: 3                          # how far back rejected files and Silver rebuilds are looked at
quarantine_spike:                         # new quarantine rows on the latest day vs the 7 days before it
  min_rows: 20                            # fewer new rows than this is never a spike
  factor: 3                               # spike = at least factor x the daily average of the 7 days before
merge_backlog_days: 2                     # BHG: FQF business days still waiting to be merged into the group
