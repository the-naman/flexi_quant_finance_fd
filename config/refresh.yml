# 5.11 controlled refresh (src/lh/refresh.py). Started only through the refresh workflow (approval required).
# test gets half of the prod people, dev a tenth of the test people; all rows of a picked person come along.
flows:
  test: {from: prod, pct: 50}
  dev:  {from: test, pct: 10}
person: {table: customers, key: customer_id, sample_by: aadhaar}  # picked by national id -> same people as BHG
fake:               # silver table -> column -> name / aadhaar / phone / date / round / token (ids: config/privacy.yml)
  customers:        {aadhaar: aadhaar, full_name: name, phone: phone, dob: date, monthly_income: round}
  disbursements:    {bank_ref: token}
  bank_settlements: {bank_ref: token}
