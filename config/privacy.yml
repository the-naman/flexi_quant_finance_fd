# Personal data rules for FQF (Phase 4 design, section 9). This one file drives every mask.
# A person in a "clear" group sees real values. Everyone else sees the masked value.
clear:
  dev:  [lh_management, lh_developer, lh_teamlead, lh_manager]   # synthetic data; these roles run the pipeline here
  test: [lh_management, lh_group_reader]
  prod: [lh_management, lh_group_reader]
  # lh_group_reader = the BHG job accounts (sp_bhg_test, sp_bhg_prod). The group consolidation (BHG repo) reads
  # fqf_<env>.gold to match people and hospital-bill payouts, so it needs the real keys there; its grants allow
  # SELECT on fqf_<env>.gold only (no bronze, silver or raw files), and Gold holds no names, phones or dates of birth.
pipeline: {test: sp_fqf_test, prod: sp_fqf_prod}                 # job accounts, always see real values

layers: [bronze, silver, gold]                                   # gold tables get their masks in the gold runner

# mask types:  last4   = only the last 4 characters shown
#              initial = first letter, then ***
#              hide    = nothing shown (works for text, dates and numbers)
#              token   = same input gives the same code, so joins and counts still work
personal:                    # silver column names; the bronze name is taken from config/silver.yml
  customers:        {aadhaar: last4, full_name: initial, phone: hide, dob: hide, monthly_income: hide, id_fingerprint: token}
  disbursements:    {bank_ref: token}
  bank_settlements: {bank_ref: token}
  reconciliation:   {ref: token}
  dim_customer:     {id_fingerprint: token, contact_fingerprint: token}
  payment_failure_windows: {customer_ref: token}    # 5.14 stream Gold (alerts, BI); see gold_tables below

# Gold tables listed under personal that are not dim_/fact_ (checked in Gold, not against Silver).
# The stream's bronze/silver.payment_events get no masks on purpose: Databricks cannot stream from a table with
# column masks, and those two tables are streaming sources. They hold synthetic references only (no names, phones,
# dates of birth or national ids); the producer pseudonymises at the source, the way a payment gateway sends tokens.
gold_tables: [payment_failure_windows]

technical: [raw_row, _rescued_data, content]      # hold a whole source row or file: hidden in every table that has them

ids:                         # person and transaction ids: shown as tokens in the listed environments
  environments: [test, prod]
  columns: [customer_id, master_customer_id, application_id, collection_id, check_id, loan_id, disb_id, repay_id, bhg_invoice_id]


  